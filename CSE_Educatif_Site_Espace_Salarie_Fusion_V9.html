<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSE Éducatif — Site et salariés fusion V9</title><style>
:root{--blue:#1278cc;--navy:#0f2660;--light:#f2f7fd;--line:#dce6f3;--txt:#172b4d}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Arial;color:var(--txt);background:#f5f8fc}button,input,select{font:inherit}button{cursor:pointer}.top{background:var(--navy);color:white;padding:13px max(18px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.brand{display:flex;gap:13px;align-items:center;font-size:20px;font-weight:800;cursor:pointer}.mark{width:45px;height:45px;border:4px solid white;border-radius:50% 50% 10% 50%;transform:rotate(-32deg);display:inline-block}.top button{border:1px solid #ffffff77;color:white;background:transparent;padding:9px 13px;border-radius:9px}.top button.on{background:white;color:var(--navy)}nav{background:white;border-bottom:1px solid var(--line);padding:12px max(18px,calc((100vw - 1200px)/2));display:flex;gap:8px;flex-wrap:wrap}nav button{border:0;background:transparent;padding:9px 14px;border-radius:9px;color:var(--navy);font-weight:650}nav button.active,nav button:hover{background:#e6f2ff;color:#075aa5}main{max-width:1200px;margin:auto;padding:28px 18px 70px}.hero{background:linear-gradient(120deg,#0f2660,#1278cc);color:white;padding:43px;border-radius:18px;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h1{font-size:36px;margin:0 0 8px;line-height:1.15}.hero p{max-width:560px}.btn{border:1px solid var(--line);background:white;color:var(--navy);padding:10px 15px;border-radius:9px;font-weight:700}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.hero .btn{background:white;color:var(--navy)}.section{margin-top:30px}.section h2{font-size:23px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 3px 16px #0f266009}.card h3{margin:8px 0}.art{height:125px;border-radius:11px;background:linear-gradient(135deg,#e8f3ff,#bddfff);display:flex;align-items:center;justify-content:center;font-size:50px}.price s{color:#7c879b;margin-right:8px}.price strong{color:var(--blue);font-size:21px}.muted{color:#63748b}.pill{font-size:12px;padding:4px 9px;border-radius:20px;background:#e6f3ff;color:#095eaa;font-weight:700}.pill.green{background:#e1f5ea;color:#137345}.pill.red{background:#ffe8e8;color:#a72f38}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:17px}.toolbar input,.toolbar select,.field input,.field select{padding:11px;border:1px solid #cbd9ea;border-radius:9px;background:white;min-width:0}.toolbar input{flex:2;min-width:180px}.toolbar select{flex:1;min-width:145px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px;text-align:left;border-bottom:1px solid var(--line)}.table th{background:#eaf2fa;font-size:12px}.tablewrap{overflow:auto}.two{display:grid;grid-template-columns:2fr 1fr;gap:18px}.notice{background:#e8f3ff;padding:13px 16px;border-radius:10px;margin:14px 0}.empty{padding:25px;text-align:center;color:#63748b}.footer{padding:25px;text-align:center;color:#6c7b8e;font-size:12px}.modalshade{position:fixed;inset:0;background:#10264aab;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}.modal{background:white;border-radius:16px;padding:25px;width:min(540px,100%);max-height:90vh;overflow:auto}.toast{position:fixed;bottom:22px;right:22px;background:#0f2660;color:white;padding:13px 18px;border-radius:10px;z-index:30}.filtertag{border:1px solid #c9ddf5;background:white;color:#0f2660;border-radius:30px;padding:7px 13px}.filtertag.active{background:#1278cc;color:white}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.hero{padding:27px}.hero h1{font-size:27px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{padding:12px 15px}.hero{display:block}}
</style><link rel="stylesheet" href="catalogue-v18.css"><link rel="stylesheet" href="seasonal-themes-v20.css?v=21"><style>.cse-public-admin-link{display:inline-flex;align-items:center;border:1px solid #ffffff77;color:white;text-decoration:none;padding:9px 13px;border-radius:9px;font-size:13px;font-weight:700}.cse-public-admin-link:hover{background:#ffffff20}</style><link rel="stylesheet" href="seasonal-premium-v24.css?v=24"></head><body><header class="top"><div class="brand" onclick="go('home')"><span class="mark"></span><span>CSE Éducatif <small style="display:block;font-size:10px;letter-spacing:1.1px;font-weight:400">LES PAPILLONS BLANCS · ROUBAIX-TOURCOING</small></span></div><div class="row"><span class="pill">DÉMONSTRATION</span><button id="modeButton" onclick="toggleMode()">Accéder à mon espace</button><a href="index.html#admin" target="_top" class="cse-public-admin-link">⚙ Administration</a></div></header><nav id="nav"></nav><main id="app"></main><footer class="footer">© CSE Éducatif · Prototype interactif local · Aucune commande, aucun paiement ni email réel</footer><div id="modal"></div><div id="toast"></div><script>
let products=[{id:1,name:'Places de cinéma',cat:'Cinéma',emoji:'🎬',public:14.5,price:8.5,desc:'Billet de cinéma valable dans les salles partenaires.'},{id:2,name:'Parc Aventure — entrée journée',cat:'Parcs d’attractions',emoji:'🎢',public:59,price:39,desc:'Une journée de loisirs au tarif CSE.'},{id:3,name:'Panier fraîcheur',cat:'Paniers fraîcheur',emoji:'🥬',public:28,price:21,desc:'Sélection de produits frais selon disponibilité.'},{id:4,name:'Billet spectacle',cat:'Spectacles',emoji:'🎭',public:48,price:32,desc:'Billetterie spectacle et concert.'},{id:5,name:'Pass musée',cat:'Culture',emoji:'🏛️',public:18,price:11,desc:'Découverte culturelle à prix réduit.'},{id:6,name:'Événement sportif',cat:'Sport',emoji:'⚽',public:42,price:29,desc:'Billet pour une rencontre sportive.'}];
const CSE_STORE="cse_fusion_v9_catalogue";
function cseSyncProducts(){try{let raw=JSON.parse(localStorage.getItem(CSE_STORE));if(raw&&Array.isArray(raw.products)){products=raw.products.map(p=>({id:p.id,name:p.name,cat:p.cat||p.category,emoji:"🎟️",public:Number(p.public)||0,price:Number(p.cse)||0,desc:p.unlimited?"Disponibilité permanente":("Stock de démonstration : "+p.stock),unlimited:!!p.unlimited,stock:p.stock}));if(typeof render==="function")render()}}catch(e){console.warn("Catalogue partagé",e)}}
window.addEventListener("storage",e=>{if(e.key===CSE_STORE)cseSyncProducts()});
cseSyncProducts();

const euro=x=>Number(x).toLocaleString('fr-FR',{style:'currency',currency:'EUR'}),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let mode='public',page='home',category='Toutes',query='',cart=[],orders=[{id:'CMD-27005',date:'02/01/2027',items:[{id:1,qty:1,price:8.5}],total:8.5,status:'Validée',invoice:'F-2027-005',tickets:[{name:'Claire_Leroy_cinema_003.pdf',supplier:'Cinéma Lumière'}]},{id:'CMD-27003',date:'03/01/2027',items:[{id:3,qty:2,price:21}],total:42,status:'En préparation',invoice:'F-2027-003',tickets:[]}],promo='',newsletter=true,profile={first:'Claire',last:'Leroy',email:'claire.leroy@exemple.fr',phone:'06 56 78 90 12',address:'4 rue du Moulin, 62000 Arras',est:'Établissement 105'};
function notify(s){document.getElementById('toast').innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>document.getElementById('toast').innerHTML='',3200)}function modal(html){document.getElementById('modal').innerHTML='<div class="modalshade" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row"><b>CSE Éducatif</b><button class="btn" onclick="closeModal()">Fermer ✕</button></div><hr>'+html+'</div></div>'}function closeModal(){document.getElementById('modal').innerHTML=''}function toggleMode(){mode=mode==='public'?'employee':'public';go(mode==='public'?'home':'dashboard')}function go(p){page=p;render();window.scrollTo(0,0)}function render(){let tabs=mode==='public'?[['home','Accueil'],['catalog','Boutique & billetterie'],['activities','Activités du CSE'],['about','Le CSE'],['contact','Contact']]:[['dashboard','Mon tableau de bord'],['catalog','Boutique'],['cart','Mon panier'],['orders','Mes commandes'],['tickets','Mes billets'],['invoices','Mes factures'],['profile','Mon profil']];document.getElementById('nav').innerHTML=tabs.map(([id,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${t}</button>`).join('');document.getElementById('modeButton').textContent=mode==='public'?'Accéder à mon espace':'← Retour au site public';document.getElementById('app').innerHTML=({home, catalog,activities,about,contact,dashboard,cart:cartPage,orders:ordersPage,tickets:ticketsPage,invoices:invoicesPage,profile:profilePage})[page]()}function header(t,d){return `<div class="section" style="margin-top:0"><h2>${t}</h2><p class="muted">${d}</p></div>`}
function home(){return `<div class="hero"><div><span class="pill">VOTRE ESPACE AVANTAGES</span><h1>Vos avantages CSE,<br>en toute simplicité.</h1><p>Billetterie, loisirs, paniers fraîcheur et services réservés aux salariés des Papillons Blancs Roubaix-Tourcoing.</p><button class="btn" onclick="go('catalog')">Découvrir les offres →</button></div><div style="font-size:100px;opacity:.9">✦</div></div><div class="section"><h2>À la une</h2><div class="grid">${products.slice(0,3).map(productCard).join('')}</div></div><div class="section"><h2>Les services du CSE</h2><div class="grid"><div class="card"><h3>🎟️ Billetterie</h3><p>Profitez des offres cinéma, parcs et spectacles.</p></div><div class="card"><h3>🌿 Paniers fraîcheur</h3><p>Commandez vos paniers selon les campagnes proposées.</p></div><div class="card"><h3>💬 Informations</h3><p>Suivez les actualités et les événements du CSE.</p></div></div></div>`}
function productCard(p){return `<article class="card"><div class="art">${p.emoji}</div><span class="pill">${esc(p.cat)}</span><h3>${esc(p.name)}</h3><p class="muted">${esc(p.desc)}</p><div class="row"><span class="price"><s>${euro(p.public)}</s><strong>${euro(p.price)}</strong></span><button class="btn primary" onclick="addCart(${p.id})">Ajouter +</button></div></article>`}function catalog(){let cats=['Toutes',...new Set(products.map(p=>p.cat))],list=products.filter(p=>(category==='Toutes'||p.cat===category)&&p.name.toLowerCase().includes(query.toLowerCase()));return header('Boutique & billetterie','Tarifs publics barrés et prix remisés réservés aux salariés.')+`<div class="toolbar"><input placeholder="Rechercher un produit..." value="${esc(query)}" oninput="query=this.value;updateCatalog()"><select onchange="category=this.value;updateCatalog()">${cats.map(c=>`<option ${category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="btn" onclick="go('cart')">🛒 Panier (${cart.reduce((a,x)=>a+x.qty,0)})</button></div><div id="productGrid" class="grid">${list.map(productCard).join('')||'<p>Aucun produit trouvé.</p>'}</div>`}function updateCatalog(){document.getElementById('productGrid').innerHTML=products.filter(p=>(category==='Toutes'||p.cat===category)&&p.name.toLowerCase().includes(query.toLowerCase())).map(productCard).join('')||'<p>Aucun produit trouvé.</p>'}function addCart(id){if(mode==='public'){modal('<h2>Offre réservée aux salariés</h2><p>Connectez-vous à votre espace salarié de démonstration pour constituer votre panier.</p><button class="btn primary" onclick="closeModal();toggleMode();go(\'catalog\')">Accéder à mon espace</button>');return}let x=cart.find(x=>x.id===id);x?x.qty++:cart.push({id,qty:1});notify('Produit ajouté au panier');render()}
function activities(){return header('Activités et prestations','Découvrez les prestations proposées par votre CSE.')+`<div class="grid">${[['🎫','Chèques-vacances','Campagnes, inscriptions et suivi des versements.'],['🏕️','Camping','Séjours et informations de réservation.'],['🎤','Concerts','Offres et événements ponctuels.'],['🥕','Paniers fraîcheur','Commandes par campagne et établissement.']].map(x=>`<div class="card"><div class="art">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><button class="btn" onclick="notify('Module présenté à titre indicatif')">En savoir plus</button></div>`).join('')}</div>`}function about(){return header('Le CSE Éducatif','Un espace pour accompagner les salariés et faciliter l’accès aux activités sociales et culturelles.')+'<div class="card"><h3>Notre mission</h3><p>Proposer des avantages et des services aux salariés, dans un environnement clair et accessible.</p><p class="muted">Les textes définitifs seront modifiables par l’administrateur depuis le CMS du site.</p></div>'}function contact(){return header('Contacter votre CSE','Formulaire de démonstration.')+`<div class="card" style="max-width:650px"><div class="field"><label>Nom</label><input id="contactName"></div><div class="field"><label>Email</label><input id="contactEmail" type="email"></div><div class="field"><label>Message</label><input id="contactMessage"></div><button class="btn primary" onclick="notify('Message simulé : aucun email envoyé')">Envoyer</button></div>`}
function dashboard(){let total=orders.reduce((a,o)=>a+o.total,0);return header('Bonjour '+esc(profile.first)+' 👋','Bienvenue dans votre espace personnel sécurisé (simulation).')+`<div class="grid"><div class="card"><div class="muted">Mes commandes</div><h2>${orders.length}</h2><button class="btn" onclick="go('orders')">Consulter →</button></div><div class="card"><div class="muted">Mes billets disponibles</div><h2>${orders.reduce((a,o)=>a+o.tickets.length,0)}</h2><button class="btn" onclick="go('tickets')">Voir mes billets →</button></div><div class="card"><div class="muted">Total de mes achats</div><h2>${euro(total)}</h2><button class="btn" onclick="go('invoices')">Mes factures →</button></div></div><div class="section"><h2>Accès rapide</h2><div class="grid"><div class="card"><h3>🛍️ Boutique</h3><p>Profitez des tarifs CSE.</p><button class="btn primary" onclick="go('catalog')">Voir les offres</button></div><div class="card"><h3>🎟️ Mes billets</h3><p>Retrouvez vos billets attribués après validation.</p><button class="btn" onclick="go('tickets')">Mes PDF</button></div><div class="card"><h3>👤 Mon profil</h3><p>Mettez à jour vos coordonnées et votre choix newsletter.</p><button class="btn" onclick="go('profile')">Modifier</button></div></div></div>`}
function cartTotal(){return cart.reduce((a,x)=>a+products.find(p=>p.id===x.id).price*x.qty,0)}function cartPage(){let base=cartTotal(),discount=promo==='BIENVENUE10'?Math.round(base*.1*100)/100:0;return header('Mon panier','Vérifiez vos articles et appliquez un code de réduction.')+`<div class="two"><div class="card">${cart.length?cart.map(x=>{let p=products.find(p=>p.id===x.id);return `<div class="row" style="border-bottom:1px solid var(--line);padding:12px 0"><div><b>${esc(p.name)}</b><div class="muted">${euro(p.price)} / unité</div></div><div class="row"><button class="btn" onclick="qty(${p.id},-1)">−</button><b>${x.qty}</b><button class="btn" onclick="qty(${p.id},1)">+</button><strong>${euro(p.price*x.qty)}</strong></div></div>`}).join(''):'<div class="empty">Votre panier est vide.</div>'}</div><div class="card"><h3>Récapitulatif</h3><div class="row"><span>Sous-total</span><b>${euro(base)}</b></div><div class="field" style="margin-top:16px"><label>Code de réduction</label><input id="promo" value="${esc(promo)}" placeholder="Ex. BIENVENUE10"></div><button class="btn" onclick="applyPromo()">Appliquer</button><p class="muted">Code de démonstration : BIENVENUE10 (−10 %).</p><div class="row"><span>Remise</span><b>− ${euro(discount)}</b></div><hr><div class="row"><b>Total</b><h2>${euro(base-discount)}</h2></div><button class="btn primary" ${!cart.length?'disabled':''} onclick="checkout()">Simuler la commande</button></div></div>`}function qty(id,d){let x=cart.find(x=>x.id===id);if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(x=>x.id!==id);render()}function applyPromo(){promo=document.getElementById('promo').value.trim().toUpperCase();render();notify(promo==='BIENVENUE10'?'Réduction appliquée':'Code non reconnu dans la démonstration')}function checkout(){if(!cart.length)return;let n=String(orders.length+6).padStart(3,'0'),base=cartTotal(),discount=promo==='BIENVENUE10'?Math.round(base*.1*100)/100:0;orders.unshift({id:'CMD-27'+n,date:new Date().toLocaleDateString('fr-FR'),items:cart.map(x=>({id:x.id,qty:x.qty,price:products.find(p=>p.id===x.id).price})),total:base-discount,status:'En attente de validation',invoice:'F-2027-'+n,tickets:[]});cart=[];promo='';modal('<h2>Commande simulée enregistrée</h2><p>La commande est en attente de validation administrative. Aucun paiement ni email réel n’a été effectué.</p><p>Les billets seront accessibles dans « Mes billets » après leur attribution et la validation par le CSE.</p><button class="btn primary" onclick="closeModal();go(\'orders\')">Voir mes commandes</button>')}
function ordersPage(){return header('Mes commandes','Historique et état de préparation de vos achats.')+`<div class="card tablewrap"><table class="table"><thead><tr><th>Commande</th><th>Date</th><th>Articles</th><th>Montant</th><th>Statut</th><th></th></tr></thead><tbody>${orders.map(o=>`<tr><td><b>${o.id}</b></td><td>${o.date}</td><td>${o.items.map(x=>esc(products.find(p=>p.id===x.id).name)+' × '+x.qty).join(', ')}</td><td>${euro(o.total)}</td><td><span class="pill ${o.status==='Validée'?'green':''}">${esc(o.status)}</span></td><td><button class="btn" onclick="orderDetails('${o.id}')">Détails</button></td></tr>`).join('')}</tbody></table></div>`}function orderDetails(id){let o=orders.find(x=>x.id===id);modal(`<h2>Commande ${o.id}</h2><p>Date : ${o.date} · ${esc(o.status)}</p>${o.items.map(x=>`<div class="row"><span>${esc(products.find(p=>p.id===x.id).name)} × ${x.qty}</span><b>${euro(x.price*x.qty)}</b></div>`).join('')}<hr><div class="row"><b>Total</b><b>${euro(o.total)}</b></div><p>Facture : ${o.invoice}</p><button class="btn" onclick="downloadInvoice('${o.id}')">Télécharger un récapitulatif</button>`)}
function ticketsPage(){let t=orders.flatMap(o=>o.tickets.map(x=>({...x,order:o})));return header('Ma billetterie','Vos billets PDF attribués par le CSE après validation.')+`<div class="card tablewrap">${t.length?`<table class="table"><thead><tr><th>Fournisseur</th><th>Fichier</th><th>Date de commande</th><th>Facture</th><th></th></tr></thead><tbody>${t.map((x,i)=>`<tr><td>${esc(x.supplier)}</td><td>${esc(x.name)}</td><td>${x.order.date}</td><td>${x.order.invoice}</td><td><button class="btn primary" onclick="downloadTicket(${i})">Télécharger PDF démo</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Aucun billet disponible pour le moment.</div>'}</div><div class="notice">Les fichiers téléchargés dans cette maquette sont des documents de démonstration, et non des billets valables.</div>`}function invoicesPage(){return header('Mes factures','Consultation de vos documents et montants.')+`<div class="card tablewrap"><table class="table"><thead><tr><th>Facture</th><th>Commande</th><th>Date</th><th>Montant</th><th>Statut</th><th></th></tr></thead><tbody>${orders.map(o=>`<tr><td>${o.invoice}</td><td>${o.id}</td><td>${o.date}</td><td>${euro(o.total)}</td><td><span class="pill ${o.status==='Validée'?'green':''}">${o.status==='Validée'?'Validée':'Provisoire'}</span></td><td><button class="btn" onclick="downloadInvoice('${o.id}')">Récapitulatif PDF</button></td></tr>`).join('')}</tbody></table></div>`}
function profilePage(){return header('Mon profil','Coordonnées et préférences de communication.')+`<div class="card" style="max-width:760px"><div class="row"><div class="field" style="flex:1"><label>Prénom</label><input id="first" value="${esc(profile.first)}"></div><div class="field" style="flex:1"><label>Nom</label><input id="last" value="${esc(profile.last)}"></div></div><div class="field"><label>Établissement (non modifiable)</label><input readonly value="${esc(profile.est)}"></div><div class="field"><label>Email</label><input id="email" type="email" value="${esc(profile.email)}"></div><div class="field"><label>Téléphone</label><input id="phone" value="${esc(profile.phone)}"></div><div class="field"><label>Adresse postale</label><input id="address" value="${esc(profile.address)}"></div><label style="display:flex;gap:10px;align-items:center;margin:16px 0"><input type="checkbox" id="newsletter" ${newsletter?'checked':''}> Je souhaite recevoir les newsletters du CSE.</label><button class="btn primary" onclick="saveProfile()">Enregistrer mon profil</button></div>`}function saveProfile(){for(let k of ['first','last','email','phone','address'])profile[k]=document.getElementById(k).value;newsletter=document.getElementById('newsletter').checked;notify('Profil modifié dans cette session de démonstration');render()}
function downloadFile(name,contents,type){let blob=new Blob([contents],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function simplePDF(lines){let content=['BT /F1 16 Tf 50 760 Td'];lines.forEach((s,i)=>{let ascii=s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'?').replace(/[()\\]/g,'');content.push((i?'0 -28 Td ':'')+'('+ascii+') Tj')});content.push('ET');let stream=content.join('\n'),objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`];let pdf='%PDF-1.4\n',offsets=[0];objs.forEach((o,i)=>{offsets.push(pdf.length);pdf+=`${i+1} 0 obj\n${o}\nendobj\n`});let start=pdf.length;pdf+='xref\n0 6\n0000000000 65535 f \n'+offsets.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${start}\n%%EOF`;return pdf}function downloadTicket(i){let t=orders.flatMap(o=>o.tickets.map(x=>({...x,order:o})))[i];if(t)downloadFile(t.name,simplePDF(['BILLET DE DEMONSTRATION - NON VALABLE','CSE Educatif - Les Papillons Blancs',t.supplier,profile.first+' '+profile.last,'Commande '+t.order.id,'Facture '+t.order.invoice]),'application/pdf')}function downloadInvoice(id){let o=orders.find(x=>x.id===id);downloadFile(o.invoice+'.pdf',simplePDF(['RECAPITULATIF DE DEMONSTRATION - NON VALABLE','CSE Educatif',profile.first+' '+profile.last,'Commande '+o.id,'Document '+o.invoice,'Total '+o.total.toFixed(2)+' EUR','Aucun document fiscal reel emis']), 'application/pdf')}
render();
</script>
<style>
.cse-featured-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.cse-featured{border:1px solid #dce6f0;background:white;border-radius:13px;padding:15px}
.cse-featured h3{margin:7px 0}
.cse-storefront{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

@media(max-width:700px){.cse-featured-grid,.cse-storefront{grid-template-columns:1fr}}

<script>
/* V12 : site public synchronisé avec le back-office dans le même navigateur */
const SHAREDPAGES="cse_fusion_v12_pages";
const originalSyncProducts=cseSyncProducts;
cseSyncProducts=function(){
originalSyncProducts();
try{const shared=JSON.parse(localStorage.getItem(CSE_STORE));if(shared&&Array.isArray(shared.products)){
products=shared.products.map(p=>({id:p.id,name:p.name,cat:p.cat||p.category,emoji:"🎟️",public:Number(p.public)||0,price:Number(p.cse)||0,supplier:p.supplier||"Fournisseur à renseigner",featured:!!p.featured,longDelay:!!p.longDelay,stock:Number(p.stock)||0,unlimited:!!p.unlimited,desc:p.longDelay?"Délai fournisseur prolongé":"Offre réservée aux salariés"}))}}
catch(e){}
};
function sharedPage(name){try{let data=JSON.parse(localStorage.getItem(SHAREDPAGES));if(data?.pages&&data?.blocks){let p=data.pages.find(p=>p.name===name);return p?data.blocks[name]:null}}catch(e){}return null}
function publicFeatured(n){return '<div class="cse-featured-grid">'+products.filter(p=>p.featured).slice(0,Math.min(8,n||8)).map(p=>'<div class="cse-featured"><div class="small muted">'+esc(p.cat)+' · '+esc(p.supplier)+'</div><h3>'+esc(p.name)+'</h3><div class="row"><s>'+euro(p.public)+'</s><b style="color:#1278cc;font-size:21px">'+euro(p.price)+'</b></div>'+(p.longDelay?'<span class="cse-delay">⏳ Délai fournisseur prolongé</span>':'')+'<p><button class="btn primary" onclick="go(\'catalog\')">Voir l’offre</button></p></div>').join("")+'</div>'}
function sharedBlockRender(b){
switch(b.type){
case "hero":return '<div class="hero"><h1>'+esc(b.title||"")+'</h1><p>'+esc(b.text||"")+'</p><button class="btn" onclick="go(\'catalog\')">Découvrir les offres</button></div>';
case "featured":return '<section class="section"><h2>'+esc(b.title||"Nos offres à la une")+'</h2>'+publicFeatured(Number(b.limit)||8)+'</section>';
case "heading":return '<div class="section"><h2>'+esc(b.title||"")+'</h2></div>';
case "text":return '<div class="section"><p style="white-space:pre-wrap">'+esc(b.text||"")+'</p></div>';
case "columns":return '<div class="section two"><div class="card">'+esc(b.left||"")+'</div><div class="card">'+esc(b.right||"")+'</div></div>';
case "image":return b.url&&/^https:\/\//.test(b.url)?'<div class="section"><img style="width:100%;max-height:420px;object-fit:cover" src="'+esc(b.url)+'" alt="'+esc(b.title||"")+'"></div>':'';
case "video":{let url="";try{let u=new URL(b.url),host=u.hostname.replace(/^www\./,"");if(host==="youtube.com"||host==="m.youtube.com"){let id=u.searchParams.get("v");if(/^[\w-]{11}$/.test(id||""))url="https://www.youtube-nocookie.com/embed/"+id}else if(host==="youtu.be"){let id=u.pathname.slice(1);if(/^[\w-]{11}$/.test(id))url="https://www.youtube-nocookie.com/embed/"+id}else if(host==="vimeo.com"&&/^\d+$/.test(u.pathname.slice(1)))url="https://player.vimeo.com/video/"+u.pathname.slice(1)}catch(e){}
return url?'<section class="section"><iframe title="Vidéo" src="'+esc(url)+'" loading="lazy" allowfullscreen style="width:100%;aspect-ratio:16/9;border:0;border-radius:12px"></iframe></section>':''}
case "button":return b.url&&/^https:\/\//.test(b.url)?'<p><a class="btn" target="_blank" rel="noopener noreferrer" href="'+esc(b.url)+'">'+esc(b.label||"En savoir plus")+'</a></p>':'';
default:return ""}
}
const legacyHome=home,legacyAbout=about,legacyContact=contact;
home=function(){let blocks=sharedPage("Accueil");if(!blocks||!blocks.length)return legacyHome()+'<section class="section"><h2>Offres mises en avant</h2>'+publicFeatured(8)+'</section>';return blocks.map(sharedBlockRender).join("")};
about=function(){let blocks=sharedPage("Le CSE");return blocks?.length?blocks.map(sharedBlockRender).join(""):legacyAbout()};
contact=function(){let blocks=sharedPage("Contact");return (blocks?.length?blocks.map(sharedBlockRender).join(""):"")+legacyContact()};
let cseVariants={};
catalog=function(){
let cats=["Toutes",...new Set(products.map(p=>p.cat))];let chosen=products.filter(p=>(category==="Toutes"||p.cat===category)&&[p.name,p.supplier,p.cat].join(" ").toLowerCase().includes(query.toLowerCase()));let groups={};chosen.forEach(p=>{let key=p.cat+"|"+p.supplier;(groups[key]??=[]).push(p)});
return header("Boutique & billetterie","Produits regroupés par catégorie puis par fournisseur, avec une liste déroulante pour les tarifs.")+
'<div class="cse-cats">'+cats.map(c=>'<button class="'+(category===c?'active':'')+'" onclick="category='+JSON.stringify(c).replace(/"/g,'&quot;')+';render()">'+esc(c)+'</button>').join("")+'</div>'+
'<div class="toolbar"><input placeholder="Rechercher un fournisseur, un produit…" value="'+esc(query)+'" oninput="query=this.value;render()"><button class="btn" onclick="go(\'cart\')">🛒 Panier ('+cart.reduce((n,x)=>n+x.qty,0)+')</button></div>'+
'<div class="cse-storefront">'+Object.entries(groups).map(([group,items])=>{let key=group;let active=items.find(p=>p.id===cseVariants[key])||items[0];cseVariants[key]=active.id;return '<article class="store-card"><span class="pill">'+esc(active.cat)+'</span><h3>'+esc(active.supplier)+'</h3><label class="small">Choisir une formule</label><select onchange="cseVariants['+JSON.stringify(key).replace(/"/g,'&quot;')+']=Number(this.value);render()">'+items.map(p=>'<option value="'+p.id+'" '+(active.id===p.id?'selected':'')+'>'+esc(p.name)+' — '+euro(p.price)+'</option>').join("")+'</select><div class="row"><s>'+euro(active.public)+'</s><strong style="font-size:23px;color:#1278cc">'+euro(active.price)+'</strong></div>'+(active.longDelay?'<div class="cse-delay">⏳ Délai fournisseur plus important</div>':'')+'<p class="small muted">'+(active.unlimited||active.stock>0?"✓ Disponible":"Indisponible")+'</p><button class="btn primary" onclick="addCart('+active.id+')" '+(!active.unlimited&&active.stock<=0?'disabled':'')+'>Ajouter au panier</button></article>'}).join("")+'</div>';
};
updateCatalog=function(){render()};
window.addEventListener("storage",e=>{if(e.key===SHAREDPAGES)render()});
cseSyncProducts();render();
</script><script src="catalogue-v18.js"></script><script src="catalogue-public-v18.js"></script><script src="seasonal-themes-v20.js?v=21"></script><script src="seasonal-public-v20.js?v=21"></script><script src="seasonal-premium-v24.js?v=24"></script></body></html>
