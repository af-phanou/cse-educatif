# A copier vers /srv/cse-educatif/compose.api.yaml.
# Complete compose.yaml (PostgreSQL) et compose.override.yaml (Caddy).
# API et base sans port public. Panneau d'etablissements : SSH seulement.
services:
  api:
    build:
      context: ./app/maquette/backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: cse_educatif
      DB_USER: cse_app
      DB_PASSWORD_FILE: /run/secrets/app_db_password
    secrets:
      - app_db_password
    networks:
      - cse_private

  migrate:
    build:
      context: ./app/maquette/backend
    command: ["node", "src/migrate.js"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: cse_educatif
      DB_ADMIN_USER: cse_dbadmin
      DB_ADMIN_PASSWORD_FILE: /run/secrets/postgres_password
      APP_DB_PASSWORD_FILE: /run/secrets/app_db_password
      ESTABLISHMENTS_DB_PASSWORD_FILE: /run/secrets/establishments_db_password
      REVIEWER_DB_PASSWORD_FILE: /run/secrets/registration_reviewer_db_password
      ROSTER_DB_PASSWORD_FILE: /run/secrets/roster_db_password
      EMAIL_VERIFIER_DB_PASSWORD_FILE: /run/secrets/email_verifier_db_password
    secrets:
      - postgres_password
      - app_db_password
      - establishments_db_password
      - registration_reviewer_db_password
      - roster_db_password
      - email_verifier_db_password
    networks:
      - cse_private

  etablissements_admin:
    build:
      context: ./app/maquette/backend
    command: ["node", "src/establishments-private-server.js"]
    restart: unless-stopped
    # Ne jamais remplacer par 0.0.0.0:8088 ! Accessible uniquement
    # via le tunnel SSH cree depuis le PC de l'administrateur.
    ports:
      - "127.0.0.1:8088:3100"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "3100"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: cse_educatif
      DB_USER: cse_site_manager
      DB_PASSWORD_FILE: /run/secrets/establishments_db_password
      PANEL_TOKEN_FILE: /run/secrets/establishments_panel_token
    secrets:
      - establishments_db_password
      - establishments_panel_token
    networks:
      - cse_private
      # Reseau bridge standard dedie : Docker 29 peut ignorer la publication
      # sur l'hote lorsque le service n'a que le reseau internal:true.
      # Ce reseau ne partage aucun service public; le port reste sur loopback.
      - cse_panel_bridge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/healthz').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 20s
      timeout: 5s
      retries: 3

  inscriptions_admin:
    build:
      context: ./app/maquette/backend
    command: ["node", "src/registration-review-private-server.js"]
    restart: unless-stopped
    # Acces strictement local sur le VPS, via tunnel SSH depuis Windows.
    # Ne PAS ouvrir 8089 au pare-feu ni l'ajouter a Caddy.
    ports:
      - "127.0.0.1:8089:3101"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "3101"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: cse_educatif
      DB_USER: cse_registration_reviewer
      DB_PASSWORD_FILE: /run/secrets/registration_reviewer_db_password
      REVIEW_TOKEN_FILE: /run/secrets/registration_review_panel_token
    secrets:
      - registration_reviewer_db_password
      - registration_review_panel_token
    networks:
      - cse_private
      - cse_panel_bridge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/healthz').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 20s
      timeout: 5s
      retries: 3

  salaries_csv_admin:
    build:
      context: ./app/maquette/backend
    command: ["node", "src/roster-private-server.js"]
    restart: unless-stopped
    # Port exclusivement sur le loopback du VPS. Tunnel SSH depuis Windows.
    ports:
      - "127.0.0.1:8090:3102"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "3102"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: cse_educatif
      DB_USER: cse_roster_manager
      DB_PASSWORD_FILE: /run/secrets/roster_db_password
      ROSTER_TOKEN_FILE: /run/secrets/roster_panel_token
    secrets:
      - roster_db_password
      - roster_panel_token
    networks:
      - cse_private
      - cse_panel_bridge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3102/healthz').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 20s
      timeout: 5s
      retries: 3

  # Test facultatif : un SEUL mail vers contact@... puis arret.
  # Le profil desactive son execution lors de docker compose up -d.
  # Aucune connexion PostgreSQL ou port entrant.
  mailer_test:
    profiles:
      - manual-mail-test
    build:
      context: ./app/maquette/backend
    command: ["node", "src/send-email-selftest.js"]
    restart: "no"
    environment:
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    secrets:
      - smtp_password
    networks:
      - cse_panel_bridge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

secrets:
  app_db_password:
    file: ./secrets/app_db_password
  establishments_db_password:
    file: ./secrets/establishments_db_password
  establishments_panel_token:
    file: ./secrets/establishments_panel_token
  registration_reviewer_db_password:
    file: ./secrets/registration_reviewer_db_password
  registration_review_panel_token:
    file: ./secrets/registration_review_panel_token
  roster_db_password:
    file: ./secrets/roster_db_password
  roster_panel_token:
    file: ./secrets/roster_panel_token
  email_verifier_db_password:
    file: ./secrets/email_verifier_db_password

  smtp_password:
    file: ./secrets/smtp_password

networks:
  cse_panel_bridge:
    driver: bridge
