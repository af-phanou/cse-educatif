function dashboard(){let pending=orders.filter(o=>o.status==="À valider").length, unpaid=orders.filter(o=>!o.paid).length;return heading("Vue d'ensemble","Votre activité CSE en un coup d'œil · données fictives")+`<div class="cards"><div class="card"><div class="label">Ventes enregistrées</div><strong>${money(orders.reduce((a,o)=>a+o.total,0))}</strong><div class="trend">↗ Activité pilote</div></div><div class="card"><div class="label">Commandes à valider</div><strong>${pending}</strong><button class="link" onclick="navigate('orders')">Traiter les commandes →</button></div><div class="card"><div class="label">Factures à suivre</div><strong>${unpaid}</strong><button class="link" onclick="navigate('billing')">Consulter les règlements →</button></div><div class="card"><div class="label">Salariés actifs</div><strong>${employees.filter(e=>e.active).length}</strong><div class="trend">Sur ${employees.length} profils de démonstration</div></div></div><div class="grid2"><section class="panel"><h3>Activité des commandes · aperçu</h3><div class="chartwrap"><div class="chart">${[35,62,43,76,53,88,70,98,65,81,58,91].map((h,i)=>`<div class="bar" style="height:${h}%"><span>${["Jan","Fév","Mar","Avr","Mai","Juin","Juil","Août","Sep","Oct","Nov","Déc"][i]}</span></div>`).join("")}</div></div><div class="sub">Graphique illustratif, sans données comptables réelles.</div></section><section class="panel"><h3>Actions prioritaires</h3>${[["Commandes en attente de validation",pending,"orders","warn"],["Factures non réglées",unpaid,"billing","red"],["Billets disponibles",tickets.filter(t=>!t.sold).length,"tickets","ok"],["Salariés inactifs",employees.filter(e=>!e.active).length,"employees","warn"]].map(([t,n,r,c])=>`<div class="listrow"><span>${t}</span><button class="btn" onclick="navigate('${r}')"><span class="pill ${c}">${n}</span> →</button></div>`).join("")}</section></div><section class="panel"><h3>Dernières commandes</h3>${orders.slice(0,4).map(o=>`<div class="listrow"><span><b>${o.id function cms(){let p=pages[cmsIndex];return heading("Gestion des pages","Modifiez les contenus sans écrire de code HTML")+`<div class="tabs">${pages.map((x,i)=>`<button class="${i===cmsIndex?"active":""}" onclick="cmsIndex=${i};render()">${esc(x.name)}</button>`).join("")}</div><div class="split"><section class="panel"><h3>Éditeur de page</h3><div class="field"><label>Titre de la page</label><input id="cmsTitle" value="${esc(p.title)}"></div><div class="field"><label>Texte de présentation</label><textarea id="cmsBody">${esc(p.body)}</textarea></div><div class="row"><button class="btn primary" onclick="savePage()">Enregistrer les modifications</button><span class="small muted">Aperçu actualisé après enregistrement</span></div><div class="note">Prototype : éditeur simplifié. La version finale disposera d'un éditeur visuel WYSIWYG (images, liens, mise en forme et blocs).</div></section><section class="panel"><h3>Aperçu du site</h3><div class="cmshero"><span>VOTRE ESPACE AVANTAGES</span><h2>${esc(p.title)}</h2><p>${esc(p.body)}</p><button class="btn">Découvrir les offres</button></div><div class="small muted">Prévisualisation indicative de la page « ${esc(p.name)} »</div></section></div>`}

const CSE_STORE="cse_fusion_v9_catalogue";

cseLoad();

function categoryModal(){showModal("<h2>Gestion des catégories</h2>",'<div class="field"><label>Nouvelle catégorie</label><input id="catName" placeholder="Ex. : Voyages"></div><button class="btn primary" onclick="addCategory()">＋ Créer</button><div class="panel" style="padding:12px;margin-top:14px">'+categories.map(c=>'<div class="listrow"><b>'+esc(c)+'</b><button class="btn" onclick="cseRenameCategory('+JSON.stringify(c).replace(/"/g,'&quot;')+')">Renommer</button><button class="btn" onclick="cseRemoveCategory('+JSON.stringify(c).replace(/"/g,'&quot;')+')">Supprimer</button></div>').join("")+'</div>')}
function addCategory(){let v=document.getElementById("catName").value.trim();if(!v||categories.some(c=>c.toLowerCase()===v.toLowerCase())){toast("Nom invalide ou déjà existant");return}categories.push(v);csePersist();closeModal();render();toast("Catégorie créée")}

ted">CSE — régime de TVA à confirmer selon les activités.</p></div><button class="btn" style="margin-top:10px" onclick="printInvoice('${o.id}')">↗ Ouvrir le PDF simulé / imprimer</button><h3 style="margin-top:20px">Billets joints</h3><div id="ticketAttachments">${p.cat==="Billetterie"?`${tickets.filter(t=>t.supplier===(p.id===1?"Cinéma Lumière":"Parc Aventure")&&!t.sold).length} billet(s) libres disponibles chez le fournisseur. Attribution à la validation.`:"Aucun billet requis pour ce produit."}</div><p class="small muted">Les billets attribués figurent dans le dossier Vendu et dans la rubrique Billetterie du salarié (simulation).</p></div></div>`)}

let invoiceSort='date',invoiceAsc=false,invoiceSelection=new Set();

`<section class="panel" style="padding:15px 18px"><div class="invoiceFilters"><div class="field"><label>Date de début</label><input type="date" value="${esc(from)}" onchange="setFilter('from',this.value)"></div><div class="field"><label>Date de fin</label><input type="date" value="${esc(to)}" onchange="setFilter('to',this.value)"></div><div class="field"><label>État de la facture</label><select onchange="setFilter('state',this.value)">${options(['Réglée','En attente de paiement','Échue'],state,'Tous les états')}</select></div><div class="field"><label>Établissement</label><select onchange="setFilter('est',this.value)">${options(establishments,est,'Tous les établissements')}</select></div><div class="field"><label>Montant minimum (€)</label><input type="number" value="${esc(min)}" placeholder="0" oninput="setFilter('min',this.value)"></div><div class="field"><label>Montant maximum (€)</label><input type="number" value="${esc(max)}" placeholder="Aucun" oninput="setFilter('max',this.value)"></div></div><div class="row" style="margin-top:8px"><input class="invoiceSearch" placeholder="⌕ Rechercher par nom, prénom, facture, produit..." value="${esc(q)}" oninput="setFilter('q',this.value)"><button class="btn" onclick="filters={};render()">Effacer les filtres</button><span class="muted small">${list.length} facture(s) · <span id="selectedCount">${invoiceSelection.size} sélectionnée(s)</span></span></div></section>`+

function exportInvoices(){let rows=[['Facture','Date','Client','Établissement','Statut','Total','Reste dû'],...orders.map(o=>['F-2027-'+o.id.slice(-3),o.date,E(o.emp).last+' '+E(o.emp).first,E(o.emp).est,invoiceStatus(o),o.total,o.paid?0:o.total])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='factures_cse_demo.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

<script>
/* V4: éditeur de factures, commandes et facturation libre. Données locales uniquement. */
let manualInvoices=[];
let invoiceEdits={};
let invoicePayments={};
let currentInvoice={type:"order",id:null};
let invoiceRows=[];
const originalBilling=billing, originalOpenOrder=openOrder;
billing=function(){
let content=originalBilling();
return `<div class="invoice-action-bar"><button class="btn primary" onclick="newManualInvoice()">＋ Créer une facture manuelle</button><span class="sub">Les commandes et les factures manuelles utilisent le même éditeur.</span></div>`+content+`<section class="panel"><h3>Factures manuelles</h3><div class="tablewrap"><table><thead><tr><th>Numéro</th><th>Client</th><th>Objet</th><th>Total</th><th>Action</th></tr></thead><tbody>${manualInvoices.map(m=>`<tr><td>${esc(m.number)}</td><td>${esc((E(m.emp)||{}).first||"")} ${esc((E(m.emp)||{}).last||"")}</td><td>${esc(m.lines.map(x=>x.name).join(", "))}</td><td>${money(m.lines.reduce((a,x)=>a+x.qty*x.price,0))}</td><td><button class="link" onclick="editInvoice('manual','${m.id}')">Modifier</button></td></tr>`).join("")||'<tr><td colspan="5" class="empty">Aucune facture manuelle créée</td></tr>'}</tbody></table></div></section>`;
};
openOrder=function(id){
originalOpenOrder(id);
let modal=document.querySelector(".modal");
if(modal){
let action=document.createElement("div");
action.className="invoice-action-bar";
action.innerHTML=`<button class="btn primary" onclick="editInvoice('order','${id}')">✎ Modifier articles, quantités et prix</button><span class="small muted">Avant validation définitive de la commande</span>`;
modal.insertBefore(action,modal.querySelector(".split"));
}
};
function newManualInvoice(){currentInvoice={type:"manual",id:null,emp:employees[0].id};invoiceRows=[{name:"Prestation concert",qty:1,price:0,discount:0}];showInvoiceEditor()}
function editInvoice(type,id){
currentInvoice={type,id};
let doc=type==="order"?orders.find(x=>x.id===id):manualInvoices.find(x=>x.id===id);
if(!doc)return;
currentInvoice.emp=doc.emp;
invoiceRows=(type==="order"?(invoiceEdits[id]||[{name:P(doc.product).name,qty:doc.qty,price:doc.total/doc.qty,discount:0}]):doc.lines).map(x=>({...x}));
showInvoiceEditor();
}
function showInvoiceEditor(){
let doc=currentInvoice.type==="order"?orders.find(x=>x.id===currentInvoice.id):manualInvoices.find(x=>x.id===currentInvoice.id);
let emp=E(currentInvoice.emp)||employees[0];
let number=doc?(currentInvoice.type==="order"?"F-2027-"+doc.id.slice(-3):doc.number):"Brouillon — nouvelle facture";
let paid=doc&&currentInvoice.type==="order"&&doc.paid?doc.total:0;
let payments=invoicePayments[currentInvoice.type+":"+currentInvoice.id]||[];
showModal(`<h2>Facture de vente · ${esc(number)}</h2>`,`<div class="invoice-editor-head"><div class="row"><div class="field"><label>Salarié / client</label><select id="invEmp" onchange="currentInvoice.emp=+this.value;showInvoiceEditor()">${employees.map(e=>`<option value="${e.id}" ${e.id===currentInvoice.emp?"selected":""}>${esc(e.first+" "+e.last)}</option>`).join("")}</select></div><div class="field"><label>Établissement</label><input readonly value="${esc(emp.est)}"></div><div class="field"><label>Adresse</label><input readonly value="${esc(emp.address)}"></div></div><div class="row"><span class="small muted">Email : ${esc(emp.email)} · Tél. : ${esc(emp.phone)}</span><span class="pill ${doc&&currentInvoice.type==="order"&&doc.status==="Validée"?"warn":"ok"}">${doc&&currentInvoice.type==="order"&&doc.status==="Validée"?"Déjà validée":"Modifiable"}</span></div></div>
<div class="invoice-editor-tab"><button id="itab0" class="active" onclick="invoiceTab(0)">Produits ou services</button><button id="itab1" onclick="invoiceTab(1)">Règlements</button><button id="itab2" onclick="invoiceTab(2)">Notes</button></div>
<div class="invoice-editor-panel active" id="ipanel0"><div class="tablewrap"><table class="invoice-edit-table"><thead><tr><th>Produit / prestation</th><th>Quantité</th><th>Prix unitaire CSE (€)</th><th>Remise (€)</th><th>Montant</th><th></th></tr></thead><tbody id="invoiceLines"></tbody></table></div><div class="invoice-action-bar"><button class="btn" onclick="addInvoiceLine()">＋ Ajouter une ligne libre</button><button class="btn" onclick="addCatalogLine()">＋ Ajouter un produit du catalogue</button></div><div class="invoice-summary"><span>Total de la facture</span><b id="invoiceTotal">0,00 €</b></div><div class="invoice-help">Les montants sont présentés sans calcul de TVA dans cette démonstration. Le régime fiscal du CSE reste à confirmer.</div></div>
<div class="invoice-editor-panel" id="ipanel1"><h3>Historique des règlements</h3><div id="paymentHistory">${payments.map(x=>`<div class="listrow">${esc(x.date)} · ${esc(x.method)} <b>${money(x.amount)}</b></div>`).join("")||'<p class="muted">Aucun versement complémentaire saisi.</p>'}</div><div class="row"><div class="field"><label>Montant du versement (€)</label><input id="payAmount" type="number" step=".01" min="0"></div><div class="field"><label>Mode de paiement</label><select id="payMethod"><option>Chèque</option><option>Carte bancaire</option><option>Virement</option><option>PayPal</option><option>Chèques-vacances</option><option>Autre</option></select></div><button class="btn" onclick="addInvoicePayment()">Enregistrer un versement</button></div><div class="note">Les versements ne modifient pas le montant de la facture. Une véritable application conservera les écritures et leur historique.</div></div>
<div class="invoice-editor-panel" id="ipanel2"><div class="field"><label>Note interne</label><textarea id="invNote" placeholder="Informations complémentaires pour le CSE...">${esc(doc?.note||"")}</textarea></div></div>
<div class="invoice-edit-footer"><span class="small muted">Prototype local : aucune facture officielle émise.</span><div class="row"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveInvoiceEditor()">Enregistrer les modifications</button></div></div>`);
renderInvoiceLines();
}
function invoiceTab(n){for(let i=0;i<3;i++){document.getElementById("itab"+i).classList.toggle("active",i===n);document.getElementById("ipanel"+i).classList.toggle("active",i===n)}}
function renderInvoiceLines(){let root=document.getElementById("invoiceLines");if(!root)return;root.innerHTML=invoiceRows.map((x,i)=>`<tr><td><input aria-label="Désignation" value="${esc(x.name)}" oninput="updateInvoiceLine(${i},'name',this.value)"></td><td><input type="number" min="1" step="1" value="${x.qty}" oninput="updateInvoiceLine(${i},'qty',this.value)"></td><td><input type="number" min="0" step=".01" value="${x.price}" oninput="updateInvoiceLine(${i},'price',this.value)"></td><td><input type="number" min="0" step=".01" value="${x.discount||0}" oninput="updateInvoiceLine(${i},'discount',this.value)"></td><td id="invAmount${i}">${money(Math.max(0,x.qty*x.price-(x.discount||0)))}</td><td><button class="link" onclick="removeInvoiceLine(${i})">Supprimer</button></td></tr>`).join("");refreshInvoiceTotal()}
function updateInvoiceLine(i,k,v){invoiceRows[i][k]=k==="name"?v:Number(v);let el=document.getElementById("invAmount"+i);if(el)el.textContent=money(Math.max(0,invoiceRows[i].qty*invoiceRows[i].price-invoiceRows[i].discount));refreshInvoiceTotal()}
function invoiceSum(){return invoiceRows.reduce((a,x)=>a+Math.max(0,x.qty*x.price-(x.discount||0)),0)}
function refreshInvoiceTotal(){let el=document.getElementById("invoiceTotal");if(el)el.textContent=money(invoiceSum())}
function addInvoiceLine(){invoiceRows.push({name:"Nouvelle prestation",qty:1,price:0,discount:0});renderInvoiceLines()}
function addCatalogLine(){let names=products.map(p=>p.id+" : "+p.name).join("\n");let id=Number(prompt("Identifiant du produit à ajouter :\n"+names));let p=P(id);if(!p){toast("Produit introuvable");return}invoiceRows.push({name:p.name,qty:1,price:p.cse,discount:0});renderInvoiceLines()}
function removeInvoiceLine(i){invoiceRows.splice(i,1);renderInvoiceLines()}
function addInvoicePayment(){let amount=Number(document.getElementById("payAmount").value);if(!(amount>0)){toast("Montant de versement invalide");return}if(currentInvoice.id===null){toast("Enregistrez d'abord la facture");return}let key=currentInvoice.type+":"+currentInvoice.id;invoicePayments[key]??=[];invoicePayments[key].push({date:new Date().toLocaleDateString("fr-FR"),method:document.getElementById("payMethod").value,amount});showInvoiceEditor();invoiceTab(1);toast("Versement enregistré dans la démonstration")}
function saveInvoiceEditor(){
if(!invoiceRows.length||invoiceRows.some(x=>!x.name.trim()||!Number.isFinite(x.qty)||x.qty<=0||!Number.isInteger(x.qty)||!Number.isFinite(x.price)||x.price<0||!Number.isFinite(x.discount)||x.discount<0||x.discount>x.qty*x.price)){toast("Vérifiez les lignes et les montants");return}
let total=invoiceSum();
if(currentInvoice.type==="order"){
let o=orders.find(x=>x.id===currentInvoice.id);
if(o.status==="Validée"&&!confirm("Cette commande est déjà validée. Dans l'application réelle, une facture émise ne doit pas être modifiée directement : il faudra établir un avoir ou un document correctif. Continuer la simulation ?"))return;
invoiceEdits[o.id]=invoiceRows.map(x=>({...x}));o.total=total;o.emp=currentInvoice.emp;
if(invoiceRows.length===1){o.qty=invoiceRows[0].qty}
toast("Commande et détail de facturation mis à jour (simulation)");
}else{
let m=manualInvoices.find(x=>x.id===currentInvoice.id);
if(!m){let id="MAN-"+String(manualInvoices.length+1).padStart(3,"0");m={id,number:"F-2027-M"+String(manualInvoices.length+1).padStart(3,"0"),emp:currentInvoice.emp,lines:[]};manualInvoices.push(m)}
m.emp=currentInvoice.emp;m.lines=invoiceRows.map(x=>({...x}));
toast("Facture manuelle enregistrée (simulation)");
}
closeModal();render();
}
const originalMarkInvoicePaid=typeof markInvoicePaid==="function"?markInvoicePaid:null;
</script>

<script>

function validateDiscount(code,total,emp){let d=discounts.find(x=>x.code===code.toUpperCase()&&x.enabled);if(!d)return {error:"Code inexistant ou inactif"};if(d.expires&&d.expires<"2027-01-05")return {error:"Code expiré"};if(total<d.minimum)return {error:"Montant minimum non atteint"};if(d.limit&&d.uses>=d.limit)return {error:"Quota d'utilisation atteint"};if(d.est!=="Tous"&&E(emp).est!==d.est)return {error:"Code non applicable à cet établissement"};let amount=Math.min(total,d.type==="percent"?Math.round(total*d.value)/100:d.value);return {d,amount}}
function applyDiscount(id){let o=orders.find(x=>x.id===id),code=document.getElementById("orderDiscount").value.trim().toUpperCase();if(!code){toast("Saisissez un code");return}let original=o.total+(discountApplied[id]?.amount||0),result=validateDiscount(code,original,o.emp);if(result.error){toast(result.error);return}if(discountApplied[id]?.code===code){toast("Ce code est déjà appliqué");return}if(discountApplied[id]){let prev=discounts.find(x=>x.code===discountApplied[id].code);if(prev)prev.uses--}o.total=original-result.amount;result.d.uses++;discountApplied[id]={code,amount:result.amount};toast("Réduction appliquée : "+money(result.amount));openOrder(id)}

<script>
/* V7 : constructeur de pages local sans serveur. */
let cmsBlocksByPage={};
let cmsSelectedBlock=-1;
let cmsPreviewMode=false;
let cmsDragIndex=-1;
const cmsBlockTypes=[
["heading","▣","Titre"],["text","☰","Texte"],["image","▧","Image"],["video","▶","Vidéo intégrée"],["button","↗","Bouton / lien"],["columns","▥","Deux colonnes"],["separator","—","Séparateur"],["hero","▤","Bannière"]
];
function cmsDefaultBlock(type){
const b={type,id:Date.now()+Math.random(),title:"Votre titre",text:"Rédigez votre contenu ici.",url:"",label:"En savoir plus",left:"Colonne gauche",right:"Colonne droite"};
if(type==="video")b.url="https://www.youtube.com/watch?v=jfKfPfyJRdk";
return b;
}
function cmsGetBlocks(){let k=pages[cmsIndex]?.name;if(!k)return [];if(!cmsBlocksByPage[k])cmsBlocksByPage[k]=[Object.assign(cmsDefaultBlock("hero"),{title:pages[cmsIndex].title,text:pages[cmsIndex].body}),cmsDefaultBlock("text")];return cmsBlocksByPage[k]}
function cmsAddPage(){let name=prompt("Nom de la nouvelle page :");if(!name||!name.trim())return;name=name.trim();if(pages.some(x=>x.name.toLowerCase()===name.toLowerCase())){toast("Une page porte déjà ce nom");return}pages.push({name,title:name,body:""});cmsIndex=pages.length-1;cmsSelectedBlock=-1;cmsPreviewMode=false;render();toast("Nouvelle page créée")}
function cmsAddBlock(type,index){let b=cmsDefaultBlock(type),arr=cmsGetBlocks();arr.splice(index==null?arr.length:index,0,b);cmsSelectedBlock=arr.indexOf(b);render()}
function cmsMoveBlock(i,dir){let a=cmsGetBlocks(),j=i+dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];cmsSelectedBlock=j;render()}
function cmsRemoveBlock(i){cmsGetBlocks().splice(i,1);cmsSelectedBlock=-1;render()}
function cmsSelectBlock(i){cmsSelectedBlock=i;render()}
function cmsSetBlockField(k,v){let b=cmsGetBlocks()[cmsSelectedBlock];if(!b)return;b[k]=v;let preview=document.getElementById("cmsLivePreview");if(preview)preview.innerHTML=cmsGetBlocks().map(cmsRenderBlock).join("");}
function cmsVideoEmbed(url){
try{let u=new URL(url);let h=u.hostname.replace(/^www\./,"");if(h==="youtube.com"||h==="m.youtube.com"){let id=u.searchParams.get("v");if(id&&/^[\w-]{11}$/.test(id))return "https://www.youtube-nocookie.com/embed/"+id}
if(h==="youtu.be"){let id=u.pathname.slice(1);if(/^[\w-]{11}$/.test(id))return "https://www.youtube-nocookie.com/embed/"+id}
if(h==="vimeo.com"){let id=u.pathname.split("/")[1];if(/^\d+$/.test(id))return "https://player.vimeo.com/video/"+id}
}catch(e){}return null;
}
function cmsRenderBlock(b){
let t=esc(b.title),x=esc(b.text),url=esc(b.url),label=esc(b.label);
switch(b.type){
case "heading":return `<h2>${t}</h2>`;
case "text":return `<p style="white-space:pre-wrap">${x}</p>`;
case "image":return b.url&&/^https?:\/\//i.test(b.url)?`<img src="${url}" alt="${t}" onerror="this.style.display='none'">`:`<div class="cms-empty">▧ Image : ajoutez une URL HTTPS</div>`;
case "video":{let embed=cmsVideoEmbed(b.url);return embed?`<iframe loading="lazy" src="${esc(embed)}" title="Vidéo intégrée" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`:`<div class="cms-empty">▶ Ajoutez un lien YouTube ou Vimeo valide</div>`}
case "button":return `<a href="${/^https?:\/\//i.test(b.url)?url:"#"}" target="_blank" rel="noopener noreferrer" onclick="event.preventDefault()" style="display:inline-block;background:#1278cc;color:white;padding:11px 17px;border-radius:8px;text-decoration:none">${label}</a>`;
case "columns":return `<div class="cms-columns"><div>${esc(b.left)}</div><div>${esc(b.right)}</div></div>`;
case "separator":return `<hr>`;
case "hero":return `<div style="background:#0F2660;color:white;border-radius:12px;padding:25px"><h2 style="color:white;margin:0 0 9px">${t}</h2><p>${x}</p></div>`;
default:return "";
}
}
function cmsEditorFields(b){if(!b)return '<div class="cms-empty">Sélectionnez un bloc pour le modifier.</div>';
const input=(label,key,value)=>`<div class="field"><label>${label}</label><input value="${esc(value)}" oninput="cmsSetBlockField('${key}',this.value)"></div>`;
const area=(label,key,value)=>`<div class="field"><label>${label}</label><textarea oninput="cmsSetBlockField('${key}',this.value)">${esc(value)}</textarea></div>`;
let out=`<h3>Modifier : ${esc(cmsBlockTypes.find(x=>x[0]===b.type)?.[2]||b.type)}</h3>`;
if(["heading","hero","image"].includes(b.type))out+=input("Titre / description", "title",b.title);
if(["text","hero"].includes(b.type))out+=area("Contenu","text",b.text);
if(["image","video","button"].includes(b.type))out+=input(b.type==="video"?"Lien YouTube ou Vimeo":b.type==="image"?"URL de l'image (HTTPS)":"URL de destination","url",b.url);
if(b.type==="button")out+=input("Texte du bouton","label",b.label);
if(b.type==="columns")out+=area("Colonne gauche","left",b.left)+area("Colonne droite","right",b.right);
if(b.type==="video")out+='<p class="cms-iframe-note">La vidéo se lit directement dans la page lorsque le fournisseur autorise l’intégration. Aucun fichier vidéo n’est hébergé ici.</p>';
return out;
}
cms=function(){
let p=pages[cmsIndex],a=cmsGetBlocks();
return heading("Éditeur de pages","Créez des pages et composez-les par glisser-déposer, sans HTML",
`<button class="btn primary" onclick="cmsAddPage()">＋ Nouvelle page</button>`)
+`<div class="cms-pagebar"><label>Page :</label><select class="btn" onchange="cmsIndex=+this.value;cmsSelectedBlock=-1;render()">${pages.map((x,i)=>`<option value="${i}" ${i===cmsIndex?"selected":""}>${esc(x.name)}</option>`).join("")}</select><button class="btn" onclick="cmsPreviewMode=!cmsPreviewMode;render()">${cmsPreviewMode?"Modifier":"Prévisualiser"}</button><button class="btn primary" onclick="cmsSaveBuilder()">Enregistrer la page</button></div>`
+(cmsPreviewMode?`<section class="panel"><h3>Aperçu · ${esc(p.name)}</h3><div class="cms-preview">${a.map(cmsRenderBlock).join("")}</div></section>`:
`<div class="cms-builder"><section class="panel"><h3>Bibliothèque de blocs</h3><p class="small muted">Glissez un bloc vers la page, ou cliquez pour l'ajouter.</p>${cmsBlockTypes.map(([type,icon,name])=>`<div class="cms-library-item" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','new:${type}')" onclick="cmsAddBlock('${type}')">${icon} &nbsp; ${name}</div>`).join("")}</section>
<section class="panel"><h3>Structure de la page</h3><div class="cms-canvas" ondragover="event.preventDefault()" ondrop="cmsDrop(event,${a.length})">${a.length?a.map((b,i)=>`<div class="cms-block ${cmsSelectedBlock===i?"selected":""}" draggable="true" ondragstart="event.stopPropagation();event.dataTransfer.setData('text/plain','move:${i}')" ondragover="event.preventDefault();event.stopPropagation()" ondrop="event.preventDefault();event.stopPropagation();cmsDrop(event,${i})"><div class="blocktools"><b onclick="cmsSelectBlock(${i})" style="cursor:pointer">☷ ${esc(cmsBlockTypes.find(x=>x[0]===b.type)?.[2])}</b><span><button onclick="cmsMoveBlock(${i},-1)">↑</button><button onclick="cmsMoveBlock(${i},1)">↓</button><button onclick="cmsRemoveBlock(${i})">✕</button></span></div><div onclick="cmsSelectBlock(${i})">${cmsRenderBlock(b)}</div></div>`).join(""):`<div class="cms-empty">Déposez un bloc ici pour commencer.</div>`}</div></section>
<section class="panel cms-inspector"><h3>Propriétés du bloc</h3>${cmsEditorFields(a[cmsSelectedBlock])}<hr><h3>Aperçu en direct</h3><div id="cmsLivePreview" class="cms-preview">${a.map(cmsRenderBlock).join("")}</div></section></div>`);
};
function cmsDrop(ev,index){ev.preventDefault();let data=ev.dataTransfer.getData("text/plain");if(data.startsWith("new:"))cmsAddBlock(data.slice(4),index);else if(data.startsWith("move:")){let from=+data.slice(5),a=cmsGetBlocks();if(from===index)return;let b=a.splice(from,1)[0];let target=from<index?index-1:index;a.splice(target,0,b);cmsSelectedBlock=target;render()}}
function cmsSaveBuilder(){let a=cmsGetBlocks();let hero=a.find(b=>b.type==="hero"||b.type==="heading");if(hero)pages[cmsIndex].title=hero.title;let body=a.find(b=>b.type==="text"||b.type==="hero");if(body)pages[cmsIndex].body=body.text;toast("Page enregistrée pour cette session de démonstration")}

<script>
/* V13 — Commandes : sélection groupée et validation automatique conditionnée au paiement.
   Prototype local uniquement : aucun serveur, paiement ou email réel. */
const AUTO_ORDER_KEY="cse_fusion_v13_auto_paid";
let autoPaidOrders=false;
try { autoPaidOrders=localStorage.getItem(AUTO_ORDER_KEY)==="true"; } catch(e) {}
let selectedBulkOrders=new Set();
let bulkAutomationBusy=false;
const originalOrdersViewV13=ordersView;
const originalTogglePaidV13=togglePaid;
const originalValidateOrderV13=validateOrder;
function ordersBulkCandidates(){
  return orders.filter(o=>o.paid===true && o.status!=="Validée" && o.emailSent!==true);
}
function validateBatchOrders(ids, automated){
  let success=0, skipped=0, blocked=0;
  const initial=ids.slice();
  // Validate only orders with confirmed/simulated full payment.
  for(const id of initial){
    let o=orders.find(x=>x.id===id);
    if(!o || o.status==="Validée" || o.emailSent===true){skipped++;continue}
    if(o.paid!==true){blocked++;continue}
    // Respect the business rule for multiple overdue unpaid orders, when known in the demo.
    const overdue=orders.filter(x=>x.emp===o.emp && x.id!==o.id && x.paid!==true && x.status==="Impayée +30j");
    if(overdue.length>1){blocked++;continue}
    originalValidateOrderV13(id);
    if(o.status==="Validée"){success++;selectedBulkOrders.delete(id)}else{blocked++}
  }
  return {success,skipped,blocked};
}
function confirmSelectedOrders(){
  const ids=[...selectedBulkOrders];
  if(ids.length===0){toast("Sélectionnez au moins une commande");return}
  const candidates=ids.filter(id=>orders.some(o=>o.id===id && o.paid===true && o.status!=="Validée"));
  const excluded=ids.length-candidates.length;

  const r=validateBatchOrders(candidates,false);
  render();
  toast(r.success+" commande(s) validée(s). "+(r.blocked+r.skipped+excluded)+" ignorée(s) ou bloquée(s).");
}
function updateBulkSelection(id,on){

function toggleAutomaticPaidOrders(enabled){

function processEligiblePaidOrders(){
  if(!autoPaidOrders || bulkAutomationBusy)return {success:0,blocked:0,skipped:0};

}
togglePaid=function(id){

ordersView=function(){

  return panel+initial

<script>
/* V14 : verrouillage visuel du réglage automatique par code PIN de démonstration.
   Le code est contrôlé dans le navigateur : aucune protection serveur réelle. */
const AUTO_PIN_DEMO="2027";
let pendingAutoMode=null;
let pinFailures=0;
function closeAutoPin(){
  pendingAutoMode=null;
  const root=document.getElementById("autoPinDialogRoot");
  if(root)root.remove();
  render(); // Repositionne la coche sur l'état réellement enregistré.
}
function requestAutoPin(enabled){
  pendingAutoMode=Boolean(enabled);
  document.getElementById("autoPinDialogRoot")?.remove();
  const root=document.createElement("div");
  root.id="autoPinDialogRoot";
  root.className="auto-pin-backdrop";
  root.innerHTML='<section class="auto-pin-dialog" role="dialog" aria-modal="true" aria-labelledby="pinTitle">'+
    '<h2 id="pinTitle">🔒 Autorisation administrateur</h2>'+
    '<p>Entrez votre code PIN à 4 chiffres pour '+(enabled?'activer':'désactiver')+' la validation automatique des commandes payées.</p>'+
    '<label for="autoPinInput"><b>Code de sécurité</b></label>'+
    '<input id="autoPinInput" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" aria-describedby="autoPinMessage" placeholder="••••">'+
    '<p id="autoPinMessage" class="auto-pin-error" role="alert"></p>'+
    '<p class="small muted">Code de démonstration : <b>2027</b>. La version réelle utilisera une vérification sécurisée côté serveur.</p>'+
    '<div class="auto-pin-actions"><button class="btn" onclick="closeAutoPin()">Annuler</button><button class="btn primary" onclick="confirmAutoPin()">Confirmer</button></div></section>';
  document.body.appendChild(root);
  const input=document.getElementById("autoPinInput");
  input.focus();
  input.addEventListener("input",()=>{input.value=input.value.replace(/\D/g,"").slice(0,4);document.getElementById("autoPinMessage").textContent=""});
  input.addEventListener("keydown",e=>{if(e.key==="Enter")confirmAutoPin();if(e.key==="Escape")closeAutoPin()});
}
function confirmAutoPin(){
  const input=document.getElementById("autoPinInput");
  const value=input?.value||"";
  const err=document.getElementById("autoPinMessage");
  if(!/^\d{4}$/.test(value)){err.textContent="Saisissez exactement 4 chiffres.";return}
  if(value!==AUTO_PIN_DEMO){
    pinFailures++;
    err.textContent="Code incorrect. Le réglage n'a pas été modifié.";
    input.value="";input.focus();
    return;
  }
  pinFailures=0;
  const enabled=pendingAutoMode;
  document.getElementById("autoPinDialogRoot")?.remove();
  pendingAutoMode=null;
  if(enabled===autoPaidOrders){render();return}
  autoPaidOrders=enabled;
  try{localStorage.setItem(AUTO_ORDER_KEY,String(enabled))}catch(e){}
  if(enabled){
    const result=processEligiblePaidOrders();
    render();
    toast("Validation automatique activée : "+result.success+" commande(s) traitée(s) en simulation.");
  }else{
    render();
    toast("Validation automatique désactivée.");
  }
}
toggleAutomaticPaidOrders=requestAutoPin;
</script>

<script>
/* V15: générateur local de codes uniques avec quota par code et export CSV.
   Prototype : pas de serveur ni distribution automatique. */
const PROMO_BATCH_KEY="cse_fusion_v15_unique_batches";
let promoBatches=[];
let promoBatchFilter="Tous";
try{
 const saved=JSON.parse(localStorage.getItem(PROMO_BATCH_KEY));
 if(saved && Array.isArray(saved.batches) && Array.isArray(saved.codes)){
  promoBatches=saved.batches;
  for(const d of saved.codes){
   if(d && !discounts.some(x=>x.code===d.code)){
    discounts.push(d);discountCounter=Math.max(discountCounter,Number(d.id)+1);
   }
  }
 }
}catch(e){}
function persistPromoBatches(){
 try{localStorage.setItem(PROMO_BATCH_KEY,JSON.stringify({
  batches:promoBatches,codes:discounts.filter(d=>d.batchId)
 }))}catch(e){toast("Stockage local indisponible pour les lots")}
}
function randomPromo(length){
 const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
 let value="";
 if(window.crypto && window.crypto.getRandomValues){
  const threshold=Math.floor(256/chars.length)*chars.length;
  const bytes=new Uint8Array(length*2);
  while(value.length<length){
   window.crypto.getRandomValues(bytes);
   for(const v of bytes){
    if(v<threshold)value+=chars[v%chars.length];
    if(value.length>=length)break;
   }
  }
 }else{
  for(let i=0;i<length;i++)value+=chars[Math.floor(Math.random()*chars.length)];
 }
 return value;
}
function openPromoBatch(){
 showModal("<h2>Générer un lot de codes uniques</h2>",
 '<p class="sub">Création de codes distincts, chacun utilisable une seule fois par défaut.</p>'+
 '<div class="row"><div class="field"><label>Nom du lot</label><input id="batchName" placeholder="Ex. Noël 2027"></div>'+
 '<div class="field"><label>Nombre de codes (1 à 1000)</label><input type="number" id="batchQty" min="1" max="1000" value="20"></div>'+
 '<div class="field"><label>Préfixe facultatif (lettres et chiffres)</label><input id="batchPrefix" maxlength="12" placeholder="CSE27"></div></div>'+
 '<div class="row"><div class="field"><label>Type</label><select id="batchType"><option value="percent">Pourcentage</option><option value="fixed">Montant en euros</option></select></div>'+
 '<div class="field"><label>Valeur de remise</label><input type="number" id="batchValue" min="0.01" step="0.01" value="10"></div>'+
 '<div class="field"><label>Achat minimum (€)</label><input type="number" id="batchMin" min="0" step="0.01" value="0"></div></div>'+
 '<div class="row"><div class="field"><label>Utilisations par code</label><input type="number" id="batchUses" min="1" max="1000" value="1"></div>'+
 '<div class="field"><label>Expiration</label><input type="date" id="batchExpiry" value="2027-12-31"></div></div>'+
 '<div class="row"><div class="field"><label>Établissement</label><select id="batchEst"><option>Tous</option>'+establishments.map(x=>'<option>'+esc(x)+'</option>').join("")+'</select></div>'+
 '<div class="field"><label>Catégorie</label><select id="batchCategory"><option>Tous</option>'+categories.map(x=>'<option>'+esc(x)+'</option>').join("")+'</select></div></div>'+
 '<label><input id="batchActive" type="checkbox" checked> Activer immédiatement les codes</label>'+
 '<div class="note">Les codes sont générés avec 10 caractères aléatoires et contrôlés contre tous les codes existants. Les données restent locales dans cette maquette.</div>'+
 '<div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Annuler</button>'+
 '<button class="btn primary" onclick="createPromoBatch()">Générer les codes</button></div>');
}
function createPromoBatch(){
 const name=document.getElementById("batchName").value.trim();
 const qty=Number(document.getElementById("batchQty").value);
 const prefix=document.getElementById("batchPrefix").value.trim().toUpperCase();
 const type=document.getElementById("batchType").value;
 const value=Number(document.getElementById("batchValue").value);
 const minimum=Number(document.getElementById("batchMin").value);
 const limit=Number(document.getElementById("batchUses").value);
 const expires=document.getElementById("batchExpiry").value;
 const est=document.getElementById("batchEst").value;
 const scope=document.getElementById("batchCategory").value;
 const enabled=document.getElementById("batchActive").checked;
 if(!name || !Number.isInteger(qty)||qty<1||qty>1000|| !/^[A-Z0-9]{0,12}$/.test(prefix)||
 !Number.isFinite(value)||value<=0||(type==="percent"&&value>100)|| !Number.isFinite(minimum)||minimum<0||
 !Number.isInteger(limit)||limit<1||limit>1000|| !expires){
  toast("Vérifiez le nom du lot, la remise, le quota et les dates");return;
 }
 const existing=new Set(discounts.map(d=>d.code.toUpperCase()));
 const entries=[];
 const batchId="LOT-"+Date.now().toString(36).toUpperCase();
 for(let i=0;i<qty;i++){
  let code,tries=0;
  do{code=(prefix?prefix+"-":"")+randomPromo(10);tries++}while(existing.has(code)&&tries<100);
  if(existing.has(code)){toast("Impossible de garantir l'unicité");return}
  existing.add(code);
  entries.push({id:discountCounter+i,code,type,value,minimum,limit,uses:0,enabled,expires,est,scope,batchId,batchName:name});
 }
 discountCounter+=qty;discounts.push(...entries);
 promoBatches.push({id:batchId,name,count:qty,created:new Date().toISOString().slice(0,10)});
 persistPromoBatches();promoBatchFilter=batchId;
 closeModal();render();toast(qty+" codes uniques générés dans "+name);
}

 '<button class="btn primary" onclick="openPromoBatch()">＋ Générer des codes uniques en lot</button>'+

 promoBatches.map(b=>'<option value="'+esc(b.id)+'" '+(promoBatchFilter===b.id?'selected':'')+'>'+esc(b.name)+' ('+b.count+')</option>').join("")+
 '</select></label><button class="btn" onclick="exportPromoCSV()">↓ Export CSV</button>'+
 '<span class="sub">'+promoBatches.length+' lot(s) généré(s)</span></div>';
 if(promoBatchFilter==="Tous")return controls+base;
 const chosen=discounts.filter(d=>d.batchId===promoBatchFilter);
 const start=base.indexOf("<tbody>"),end=base.indexOf("</tbody>",start);
 if(start<0||end<0)return controls+base;
 const rows=chosen.map(d=>'<tr><td><b>'+esc(d.code)+'</b></td><td>'+(d.type==="percent"?d.value+" %":money(d.value))+'</td>'+
 '<td>'+money(d.minimum)+'</td><td>'+esc(d.scope)+'</td><td>'+esc(d.est)+'</td><td>'+d.uses+' / '+d.limit+'</td>'+
 '<td>'+esc(d.expires)+'</td><td><span class="pill '+(d.enabled?'ok':'red')+'">'+(d.enabled?'Actif':'Inactif')+'</span></td>'+
 '<td><button class="link" onclick="discountModal('+d.id+')">Modifier</button> · <button class="link" onclick="toggleDiscount('+d.id+')">'+(d.enabled?'Désactiver':'Activer')+'</button></td></tr>').join("");
 return controls+base.slice(0,start+6)+rows+base.slice(end);
};
function exportPromoCSV(){
 const data=discounts.filter(d=>promoBatchFilter==="Tous"||d.batchId===promoBatchFilter);
 if(!data.length){toast("Aucun code à exporter");return}
 const headings=["Lot","Code","Type","Valeur","Minimum","Quota","Utilisations","Expiration","Établissement","Catégorie","Actif"];
 const q=s=>'"'+String(s??"").replace(/"/g,'""').replace(/^[=+\-@\t\r]/,"'</body></html>")+'"';
 const csv=[headings.join(";"),...data.map(d=>[d.batchName||"",d.code,d.type,d.value,d.minimum,d.limit||"Illimité",d.uses,d.expires,d.est,d.scope,d.enabled?"Oui":"Non"].map(q).join(";"))].join("\r\n");
 const url=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"}));
 const a=document.createElement("a");a.href=url;a.download="cse_codes_"+(promoBatchFilter==="Tous"?"tous":promoBatchFilter)+".csv";
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

<script>

<script>
/* V17 — Totaux et indicateurs chiffrés sous chaque colonne, recalculés selon le lot sélectionné. */
function v17DiscountScope(){
 return discounts.filter(d=>promoBatchFilter==="Tous"||d.batchId===promoBatchFilter);
}
function v17Distinct(arr){return new Set(arr.filter(x=>x!==undefined && x!==null && x!=="")).size}
function v17DaysFromToday(date){
 if(!date)return null;
 const now=new Date();const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 const target=new Date(date+"T00:00:00");
 return Math.ceil((target-today)/86400000);
}
function v17DiscountFooter(data){
 const pct=data.filter(x=>x.type==="percent");
 const euros=data.filter(x=>x.type==="fixed");
 const totalUses=data.reduce((n,x)=>n+(Number(x.uses)||0),0);
 const finite=data.filter(x=>Number(x.limit)>0);
 const quota=finite.reduce((n,x)=>n+Number(x.limit),0);
 const unlimited=data.length-finite.length;
 const active=data.filter(x=>x.enabled).length;
 const expired=data.filter(x=>{let n=v17DaysFromToday(x.expires);return n!==null&&n<0}).length;
 const expiring=data.filter(x=>{let n=v17DaysFromToday(x.expires);return n!==null&&n>=0&&n<=30}).length;
 const minAverage=data.length?data.reduce((n,x)=>n+(Number(x.minimum)||0),0)/data.length:0;
 const pctAvg=pct.length?pct.reduce((n,x)=>n+Number(x.value||0),0)/pct.length:0;
 const euroAvg=euros.length?euros.reduce((n,x)=>n+Number(x.value||0),0)/euros.length:0;
 const val=(head,sub)=>'<b>'+head+'</b><small>'+sub+'</small>';
 return '<tfoot><tr class="discount-col-summary">'+
 '<td>'+val(data.length+' code(s)',v17Distinct(data.map(x=>x.batchId||"Hors lot"))+' lot(s) / groupe(s)')+'</td>'+
 '<td>'+val(pct.length+' en %',pct.length?'Moy. '+pctAvg.toFixed(1)+' %':'Aucun pourcentage')+
 '<small>'+euros.length+' en €'+(euros.length?' · moy. '+money(euroAvg):'')+'</small></td>'+
 '<td>'+val(money(minAverage),'Minimum moyen')+'</td>'+
 '<td>'+val(v17Distinct(data.map(x=>x.scope))+' catégorie(s)','Dont '+data.filter(x=>x.scope==="Tous").length+' toutes catégories')+'</td>'+
 '<td>'+val(v17Distinct(data.map(x=>x.est))+' établissement(s)','Dont '+data.filter(x=>x.est==="Tous").length+' tous établissements')+'</td>'+
 '<td>'+val(totalUses+' utilisation(s)',quota+' places limitées'+(unlimited?' · '+unlimited+' code(s) illimité(s)':''))+'</td>'+
 '<td>'+val(expired+' expiré(s)',expiring+' expirant sous 30 jours')+'</td>'+
 '<td>'+val(active+' actif(s)',(data.length-active)+' inactif(s)')+'</td>'+
 '<td>'+val('Total du tableau','Lot '+(promoBatchFilter==="Tous"?"Tous":promoBatchFilter))+'</td>'+
 '</tr></tfoot>';
}
const v17OriginalDiscountsView=discountsView;
discountsView=function(){
 const html=v17OriginalDiscountsView();
 const data=v17DiscountScope();
 const summary='<div class="discount-number-overview">'+
 '<div class="card"><div class="desc">Codes du lot affiché</div><div class="value">'+data.length+'</div></div>'+
 '<div class="card"><div class="desc">Codes actifs</div><div class="value">'+data.filter(x=>x.enabled).length+'</div></div>'+
 '<div class="card"><div class="desc">Utilisations des codes</div><div class="value">'+data.reduce((n,x)=>n+Number(x.uses||0),0)+'</div></div>'+
 '<div class="card"><div class="desc">Codes expirés</div><div class="value">'+data.filter(x=>{let t=v17DaysFromToday(x.expires);return t!==null&&t<0}).length+'</div></div></div>';
 const start=html.indexOf('<table class="discount-table">');
 const end=html.indexOf("</table>",start);
 if(start<0||end<0)return summary+html;
 const footer=v17DiscountFooter(data);
 return summary+html.slice(0,end)+footer+html.slice(end);
};
function v17UsageFooter(data){
 const total=data.reduce((n,x)=>n+Number(x.amount||0),0);
 const valid=data.filter(x=>x.status==="Validée").length;
 const applied=data.filter(x=>x.status==="Appliquée").length;
 return '<tfoot><tr class="discount-col-summary">'+
 '<td>'+data.length+' utilisation(s)</td>'+
 '<td>'+v17Distinct(data.map(x=>x.code))+' code(s)</td>'+
 '<td>'+v17Distinct(data.map(x=>x.employeeId||x.employeeName))+' salarié(s)</td>'+
 '<td>'+v17Distinct(data.map(x=>x.establishment))+' établissement(s)</td>'+
 '<td>'+v17Distinct(data.map(x=>x.orderId))+' commande(s)</td>'+
 '<td>'+v17Distinct(data.map(x=>x.invoice))+' facture(s)</td>'+
 '<td>'+money(total)+'<small>Total des remises enregistrées</small></td>'+
 '<td>'+valid+' validée(s)<small>'+applied+' appliquée(s)</small></td>'+
 '</tr></tfoot>';
}
const v17OriginalPromoUsageHTML=promoUsageHTML;
promoUsageHTML=function(){

refreshPromoUsage=function(){

 const oldFooter=tbody?.closest("table")?.querySelector("tfoot");
 if(oldFooter){
  const temp=document.createElement("table");

  const newFooter=temp.querySelector("tfoot");
  if(newFooter)oldFooter.replaceWith(newFooter);
 }
};
